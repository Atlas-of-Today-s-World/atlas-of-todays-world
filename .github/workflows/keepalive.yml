# Supabase Free pauses a project after a week without traffic. A daily request to
# /api/health keeps it awake and doubles as the cheapest uptime check (failure =
# e-mail from GitHub Actions). A full monitor (UptimeRobot) is set up by the owner.
name: Keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /api/health
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "Chybí proměnná repozitáře SITE_URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 20 "$SITE_URL/api/health"
