# Topics on atlas-dev: applies missing migrations (Management API, no DB
# password needed) and imports the old site's Global Issues topics, so a
# preview deployment shows them before anything reaches production.
# Never touches production: both scripts refuse its ref.
name: Topics on atlas-dev

on:
  workflow_dispatch:
  push:
    branches: [feat/topics-map-templates]
    paths:
      - "supabase/migrations/**"
      - "scripts/webflow/**"
      - "scripts/supabase-migrate-dev.mjs"
      - ".github/workflows/topics-dev.yml"

concurrency:
  group: topics-atlas-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Migrations to atlas-dev
        run: node scripts/supabase-migrate-dev.mjs
      - name: Import topics to atlas-dev
        run: node scripts/webflow/import-topics.mjs --apply --project dev --demo-places --env /dev/null
