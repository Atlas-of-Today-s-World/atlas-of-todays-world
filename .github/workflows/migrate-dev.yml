# Keeps the dev project (atlas-dev) on the same schema as main.
#
# CI e2e runs against atlas-dev, but production migrations (deploy.yml) never
# touch it, so a merged migration used to stay missing on dev until someone
# applied it by hand. This job pushes every migration on main to atlas-dev.
#
# Needs the repository secret SUPABASE_DEV_DB_PASSWORD (atlas-dev database
# password); without it the job only prints a notice. Never runs against
# production: the target ref is checked before linking.
name: Migrate atlas-dev

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate-atlas-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      DEV_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF || 'bognwszwhxxyjafqzfuh' }}
      PROD_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ewbzkxialhtwuqlenjof' }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_DEV_DB_PASSWORD is not set; atlas-dev was not migrated."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DEV_REF" = "$PROD_REF" ]; then
            echo "::error::The dev project ref equals production; refusing to migrate."
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.config.outputs.ready == 'true'
        with:
          version: latest
      # --include-all: migrations tried on dev by hand before merging may sit
      # between older ones; the CLI then applies the missing ones anyway.
      - name: Migrations to atlas-dev
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase link --project-ref "$DEV_REF"
          supabase db push --include-all --yes
