# Keeps the dev project (atlas-dev) on the same schema as main.
#
# CI e2e runs against atlas-dev, but production migrations (deploy.yml) never
# touch it, so a merged migration used to stay missing on dev until someone
# applied it by hand. This job pushes every migration on main to atlas-dev.
#
# Applies the missing migrations through the Supabase Management API with
# SUPABASE_ACCESS_TOKEN (scripts/supabase-migrate-dev.mjs). Never runs against
# production: the script refuses its ref.
name: Migrate atlas-dev

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

concurrency:
  group: migrate-atlas-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate-dev:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF || 'bognwszwhxxyjafqzfuh' }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ewbzkxialhtwuqlenjof' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Management API with the access token (no dev database password needed);
      # the script refuses the production ref.
      - name: Migrations to atlas-dev
        run: node scripts/supabase-migrate-dev.mjs
