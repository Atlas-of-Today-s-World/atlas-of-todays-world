# Noční záloha produkční databáze (PLAN F4).
#
# Schéma, data a role přes Supabase CLI → tar → šifrování `age` veřejným
# klíčem (soukromý klíč má jen vlastník, mimo GitHub) → artefakt na 14 dní.
# Nezašifrovaný dump nikdy neopustí běžící stroj.
#
# Potřebuje: secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#            variables SUPABASE_PROJECT_REF, BACKUP_AGE_RECIPIENT (age1…).
# Obnova a její zkouška: docs/runbook.md (neveřejné).
name: Záloha DB

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Nástroj age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Kontrola nastavení
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF RECIPIENT; do
            test -n "${!v}" || { echo "Chybí $v"; exit 1; }
          done
          case "$RECIPIENT" in age1*) ;; *) echo "BACKUP_AGE_RECIPIENT není age klíč"; exit 1;; esac
      - name: Dump a šifrování
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" -f "$work/schema.sql"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --role-only -f "$work/roles.sql"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f "$work/data.sql"
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          tar -C "$work" -czf - schema.sql roles.sql data.sql | age -r "$RECIPIENT" > "atlas-db-$stamp.tar.gz.age"
          rm -rf "$work"
          ls -l atlas-db-*.age
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-db-backup
          path: atlas-db-*.tar.gz.age
          retention-days: 14
          if-no-files-found: error
