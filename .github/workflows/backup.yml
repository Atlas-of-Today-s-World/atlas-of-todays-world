# Nightly backup of the production database (PLAN F4).
#
# Schema, data and roles via Supabase CLI → tar → `age` encryption with a public
# key (only the owner holds the private key, outside GitHub) → 14-day artifact.
# The unencrypted dump never leaves the runner.
#
# Requires:  secrets SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD,
#            variables SUPABASE_PROJECT_REF, BACKUP_AGE_RECIPIENT (age1…).
# Restore and restore drills: docs/runbook.md (private).
name: Záloha DB

on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7
      # Until the owner sets the age public key (PLAN U8) there is nothing to
      # encrypt to: the run says so as a warning instead of failing red every
      # night. Any other missing setting is still a hard failure.
      - name: Check configuration
        id: config
        run: |
          if [ -z "$RECIPIENT" ]; then
            echo "::warning title=No backup made::Set the repository variable BACKUP_AGE_RECIPIENT (age1…) to start nightly backups (PLAN U8)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            test -n "${!v}" || { echo "Chybí $v"; exit 1; }
          done
          case "$RECIPIENT" in age1*) ;; *) echo "BACKUP_AGE_RECIPIENT není age klíč"; exit 1;; esac
      - uses: supabase/setup-cli@v3
        if: steps.config.outputs.skip != 'true'
        with:
          version: latest
      - name: Install age
        if: steps.config.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - name: Dump and encrypt
        if: steps.config.outputs.skip != 'true'
        run: |
          set -euo pipefail
          umask 077
          work=$(mktemp -d)
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" -f "$work/schema.sql"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --role-only -f "$work/roles.sql"
          supabase db dump --password "$SUPABASE_DB_PASSWORD" --data-only --use-copy -f "$work/data.sql"
          stamp=$(date -u +%Y-%m-%dT%H%MZ)
          tar -C "$work" -czf - schema.sql roles.sql data.sql | age -r "$RECIPIENT" > "atlas-db-$stamp.tar.gz.age"
          rm -rf "$work"
          ls -l atlas-db-*.age
      - uses: actions/upload-artifact@v7
        if: steps.config.outputs.skip != 'true'
        with:
          name: atlas-db-backup
          path: atlas-db-*.tar.gz.age
          retention-days: 14
          if-no-files-found: error
