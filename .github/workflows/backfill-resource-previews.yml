# One-off fill of preview images for resources without one
# (scripts/backfill-resource-previews.mjs). atlas-dev: rows read and written
# through its service key. Production: rows exported and the updates applied
# with psql through the database password the deploy already uses (the access
# token may not read API keys) — as in import-topics.yml. Without "apply" it is
# a dry run that only lists what it would set.
name: Backfill resource previews

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Project"
        type: choice
        options: [dev, prod]
        default: dev
      apply:
        description: "Write the images (otherwise a dry run)"
        type: boolean
        default: false

concurrency:
  group: backfill-resource-previews-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    # Production content only from the reviewed code on main.
    if: inputs.target == 'dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Backfill atlas-dev
        if: inputs.target == 'dev'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: node scripts/backfill-resource-previews.mjs --project dev $APPLY --env /dev/null

      - uses: supabase/setup-cli@v3
        if: inputs.target == 'prod'
        with:
          version: 2.120.0
      - name: Backfill production
        if: inputs.target == 'prod'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROD_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          APPLY: ${{ inputs.apply }}
        run: |
          supabase link --project-ref "$PROD_REF" --password "$SUPABASE_DB_PASSWORD"
          # Session mode (5432); the password goes through PGPASSWORD, never into
          # the URL or the command line. psql stops at the first error and rolls back.
          url=$(sed -E "s#:6543/#:5432/#" supabase/.temp/pooler-url)
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$url" -v ON_ERROR_STOP=1 -qAt -c \
            "select coalesce(json_agg(json_build_object('id', id, 'url', url) order by id), '[]')
               from public.resources where image_url is null" > rows.json
          node scripts/backfill-resource-previews.mjs --rows rows.json --sql previews.sql
          if [ "$APPLY" = "true" ]; then
            PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$url" -v ON_ERROR_STOP=1 -q -f previews.sql
            echo "Applied to production."
          else
            echo "Dry run — previews.sql not applied."
          fi
