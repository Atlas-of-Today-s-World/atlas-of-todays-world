# Manual import of the old site's Global Issues topics (scripts/webflow/import-topics.mjs).
# atlas-dev: through the API with its service key, images moved to Storage,
# demo placements on the map. Production: one SQL transaction through the
# database password the deploy already uses (the access token may not read API
# keys); images keep their Webflow addresses, no demo placements.
name: Import topics

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Project"
        type: choice
        options: [dev, prod]
        default: dev

concurrency:
  group: import-topics-${{ inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  import:
    # Production content only from the reviewed code on main.
    if: inputs.target == 'dev' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Import to atlas-dev
        if: inputs.target == 'dev'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
        run: node scripts/webflow/import-topics.mjs --apply --project dev --replace-places --env /dev/null

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3 (pinned: runs next to production credentials)
        if: inputs.target == 'prod'
        with:
          version: 2.120.0
      - name: Import to production
        if: inputs.target == 'prod'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROD_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          node scripts/webflow/import-topics.mjs --sql topics.sql
          supabase link --project-ref "$PROD_REF" --password "$SUPABASE_DB_PASSWORD"
          # Session mode (5432); the password goes through PGPASSWORD, never into
          # the URL or the command line. psql stops at the first error and rolls back.
          url=$(sed -E "s#:6543/#:5432/#" supabase/.temp/pooler-url)
          PGPASSWORD="$SUPABASE_DB_PASSWORD" psql "$url" -v ON_ERROR_STOP=1 -q -f topics.sql
