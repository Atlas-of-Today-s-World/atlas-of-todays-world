# Fast gate (ARCHITEKTURA 9.1, 10.1): only what must pass before a deploy.
# On main, deploy.yml follows on success. Target: about two minutes.
#
# The full suite (e2e, Lighthouse, Storybook, DB tests, duplicity, unused code,
# audit) lives in full-tests.yml: parallel jobs that never block a deploy.
# To make it blocking again, move those jobs back here.
#
# Job names are the required status checks on `main` — do not rename them.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typy, lint, testy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Known high or critical vulnerabilities in production dependencies stop
      # the deploy (audit-ci.jsonc; the full report also runs in full-tests.yml).
      - run: npm run check:audit

  build:
    name: Build, smoke a e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Public values of the dev project (atlas-dev) — build and smoke never touch production.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # Next.js build cache: unchanged pages and modules are not compiled again.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('package-lock.json') }}-
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Smoke test against the production build
        run: |
          npm run start &
          npx --yes wait-on@9.5.1 --timeout 60000 http://localhost:3000
          npm run test:smoke
