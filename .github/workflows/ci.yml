# Kontroly kvality (ARCHITEKTURA 9.1, 10.1). Na main po úspěchu navazuje deploy.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typy, lint, testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:db
      - name: Duplicity (jscpd)
        run: npm run check:dup
      - name: Nepoužitý kód (knip)
        run: npm run check:unused
      - name: Zranitelné závislosti
        run: npm run check:audit

  build:
    name: Build, smoke a e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test proti produkčnímu buildu
        run: |
          npm run start &
          npx --yes wait-on --timeout 60000 http://localhost:3000
          npm run test:smoke
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
