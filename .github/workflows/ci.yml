# Quality checks (ARCHITEKTURA 9.1, 10.1). On main, deploy.yml follows on success.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typy, lint, testy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Storybook builds (shared component catalog)
        run: npm run build-storybook
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm run test:db
      - name: Duplicity (jscpd)
        run: npm run check:dup
      - name: Unused code (knip)
        run: npm run check:unused
      - name: Vulnerable dependencies
        run: npm run check:audit

  build:
    name: Build, smoke a e2e
    runs-on: ubuntu-latest
    # Public values of the dev project (atlas-dev) — build and e2e never touch production.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL_DEV }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY_DEV }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Smoke test against the production build
        run: |
          npm run start &
          npx --yes wait-on --timeout 60000 http://localhost:3000
          npm run test:smoke
      - name: Playwright
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        env:
          BASE_URL: http://localhost:3000
          # Only for test accounts in atlas-dev (tests/auth.spec.ts); without it the suite is skipped.
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_DEV }}
      - name: Lighthouse (performance and accessibility budgets, lighthouserc.json)
        run: npx --yes @lhci/cli@0.14 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse
          path: .lighthouseci/
          # The folder starts with a dot — without this upload-artifact@v4 skips it.
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
