# Weekly dead-link check (PLAN G3). Crawls the pages from the deployed site's
# sitemap.xml and verifies every link and image. Writes nothing — the result is
# only in the output and job summary; a broken link = failed run (e-mail from Actions).
name: Kontrola odkazů

on:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Links in published content
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "Chybí proměnná repozitáře SITE_URL"; exit 1; }
          node scripts/check-links.mjs
