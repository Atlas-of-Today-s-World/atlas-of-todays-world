# Nasazení na Vercel přes token (Hobby účet nenasazuje z Git integrace commity
# cizích autorů, proto nasazuje tahle pipeline).
#   - main: produkce, ale až když na daném commitu prošlo CI (ci.yml)
#   - pull request: náhledová verze
#
# Build běží na Vercelu, ne tady: Hobby dovolí nahrát max. 5 000 souborů denně
# a hotový build (~270 stránek) by limit vyčerpal po pár nasazeních. Nahrává se
# jen zdrojový kód a nezměněné soubory Vercel podle hashe znovu nechce.
# Co se nenahrává, určuje .vercelignore.
name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "demo/**"
      - "tests/**"
      - "supabase/tests/**"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    # Produkci nasadit jen po zeleném CI. Náhled PR z forku nemá přístup k tokenu.
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install --global vercel@latest

      - name: Deploy
        run: vercel deploy ${{ github.event_name != 'pull_request' && '--prod' || '' }} --yes --token=${{ secrets.VERCEL_TOKEN }}
