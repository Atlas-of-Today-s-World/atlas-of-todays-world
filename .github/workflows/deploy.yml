# Deploys to Vercel via token (a Hobby account won't deploy commits by other
# authors from the Git integration, so this pipeline deploys instead).
#   - main: production, but only once CI (ci.yml) has passed on that commit
#   - pull request: preview deployment
#
# The build runs on Vercel, not here: Hobby allows uploading max. 5,000 files a day
# and a finished build (~270 pages) would exhaust the limit after a few deploys.
# Only source code is uploaded, and Vercel skips unchanged files by hash.
# What is not uploaded is set by .vercelignore.
name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "tests/**"
      - "supabase/tests/**"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

# Production is only ever built from a push to main of this repository:
#   - workflow_run: "branches: [main]" matches the head branch NAME of the CI
#     run, which a pull request from a fork's own "main" branch also has, so
#     the event, the repository and the branch are all checked explicitly;
#   - workflow_dispatch: only from main (a manual run could pick any branch).
jobs:
  # Database migrations go to production BEFORE the app is deployed — so they
  # must be backward compatible with the running version (ARCHITEKTURA 6.3).
  # PR previews don't run migrations; they are tried on the dev project (atlas-dev).
  migrate:
    if: >-
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Production credentials only in the step that runs the migrations (below),
    # not in the job: no other step or action sees them.
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3 (pinned: runs next to production credentials)
        with:
          version: 2.120.0
      # --include-seed: supabase/seed.sql (a frozen snapshot of the initial content)
      # is loaded into the empty production once. The CLI remembers its hash in
      # supabase_migrations.seed_files and won't rerun an already applied seed, so
      # it doesn't overwrite what editors have since changed in the admin.
      - name: Migrace do produkce
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes

  deploy:
    needs: migrate
    # Deploy production only after green CI and a successful migration. A PR
    # preview from a fork or from Dependabot has no access to the token, so it
    # is skipped instead of failing red on every dependency bump.
    if: >-
      always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Exact version: a hijacked "latest" release would run with the deploy token.
      - run: npm install --global vercel@62.5.0

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROD_FLAG: ${{ github.event_name != 'pull_request' && '--prod' || '' }}
        run: vercel deploy $PROD_FLAG --yes --token "$VERCEL_TOKEN"
