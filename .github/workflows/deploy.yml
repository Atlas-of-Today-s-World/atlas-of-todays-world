# Nasazení na Vercel přes token (Hobby účet nenasazuje z Git integrace commity
# cizích autorů, proto nasazuje tahle pipeline).
# Push do main = produkce, pull request = náhledová verze.
#
# Build běží na Vercelu, ne tady: Hobby dovolí nahrát max. 5 000 souborů denně
# a hotový build (~270 stránek) by limit vyčerpal po pár nasazeních. Nahrává se
# jen zdrojový kód a nezměněné soubory Vercel podle hashe znovu nechce.
# Co se nenahrává, určuje .vercelignore.
name: Deploy to Vercel

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "demo/**"
      - "tests/**"
      - "supabase/tests/**"
  pull_request:
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "demo/**"
      - "tests/**"
      - "supabase/tests/**"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - run: npm install --global vercel@latest

      - name: Deploy
        run: vercel deploy ${{ github.event_name != 'pull_request' && '--prod' || '' }} --yes --token=${{ secrets.VERCEL_TOKEN }}
