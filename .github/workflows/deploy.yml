# Nasazení na Vercel přes token (Hobby účet nenasazuje z Git integrace commity
# cizích autorů, proto nasazuje tahle pipeline).
#   - main: produkce, ale až když na daném commitu prošlo CI (ci.yml)
#   - pull request: náhledová verze
#
# Build běží na Vercelu, ne tady: Hobby dovolí nahrát max. 5 000 souborů denně
# a hotový build (~270 stránek) by limit vyčerpal po pár nasazeních. Nahrává se
# jen zdrojový kód a nezměněné soubory Vercel podle hashe znovu nechce.
# Co se nenahrává, určuje .vercelignore.
name: Deploy to Vercel

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths-ignore:
      - "*.md"
      - ".claude/**"
      - ".github/*.md"
      - ".github/CODEOWNERS"
      - ".github/dependabot.yml"
      - "demo/**"
      - "tests/**"
      - "supabase/tests/**"
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  # Migrace databáze do produkce PŘED nasazením aplikace — proto musí být
  # zpětně kompatibilní s běžící verzí (ARCHITEKTURA 6.3). Náhledy PR migrace
  # nespouští; zkoušejí se na dev projektu (atlas-dev).
  migrate:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # --include-seed: supabase/seed.sql (zmrazený snímek výchozího obsahu) se
      # do prázdné produkce nahraje jednou. CLI si pamatuje hash v
      # supabase_migrations.seed_files a už nahraný seed znovu nespustí, takže
      # nepřepíše, co redakce mezitím změnila v administraci.
      - name: Migrace do produkce
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --include-seed --password "$SUPABASE_DB_PASSWORD" --yes

  deploy:
    needs: migrate
    # Produkci nasadit jen po zeleném CI a úspěšné migraci. Náhled PR z forku
    # nemá přístup k tokenu.
    if: >-
      always() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: npm install --global vercel@latest

      - name: Deploy
        run: vercel deploy ${{ github.event_name != 'pull_request' && '--prod' || '' }} --yes --token=${{ secrets.VERCEL_TOKEN }}
